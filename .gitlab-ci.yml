# Go CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'
  - project: 'services/tech-radar'
    file: '/ci/radar.yml'

stages: [lint, test, build, deploy]

variables:
  GOPROXY: 'https://proxy.golang.org,direct'
  GO_VERSION: '1.25'
  GOPRIVATE: 'gitlab.flexinfer.ai/*'
  GOFLAGS: '-buildvcs=false'
  KUBERNETES_HELPER_IMAGE: 'registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-v18.6.2'

.go-image:
  image: golang:1.25
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/".insteadOf "https://gitlab.flexinfer.ai/"
    - mkdir -p ../../libs
    - '[ -d ../../libs/fi-mcp-kit/.git ] || git clone --depth 1 https://gitlab.flexinfer.ai/libs/fi-mcp-kit.git ../../libs/fi-mcp-kit'
    - '[ -d ../../libs/mcp-go/.git ] || git clone --depth 1 https://gitlab.flexinfer.ai/libs/mcp-go.git ../../libs/mcp-go'
    - go mod download

lint:gofmt:
  extends: [.go-base, .go-image]
  stage: lint
  script:
    - unformatted=""
    - if [ -n "" ]; then echo "Go code is not formatted"; git ls-files -z '*.go' | xargs -0 gofmt -d; exit 1; fi

lint:vet:
  extends: [.go-base, .go-image]
  stage: lint
  script:
    - go vet ./...

test:
  extends: [.go-test, .go-image]
  variables:
    CGO_ENABLED: '1'

build:
  extends: [.go-build, .go-image]
  script:
    - mkdir -p bin
    - go build -o bin/fi-mcp-gateway ./cmd/fi-mcp-gateway
  artifacts:
    paths:
      - bin/fi-mcp-gateway
    expire_in: 1 week

deploy:
  stage: deploy
  image: registry.harbor.lan/dockerhub-cache/library/alpine:3.21
  script:
    - echo "No deploy configured for fi-mcp-gateway (binary-only repo)."
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

radar-scan:
  extends: .radar-scan
