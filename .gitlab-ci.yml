# Go CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'

stages: [lint, test, build, deploy]

variables:
  GO_VERSION: "1.24"
  GOPRIVATE: "gitlab.flexinfer.ai/*"
  GOFLAGS: "-buildvcs=false"

# Override image since GitLab CI doesn't expand variables in image field from includes
.go-image:
  image: golang:1.24
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.flexinfer.ai/".insteadOf "https://gitlab.flexinfer.ai/"
    - go mod download

lint:gofmt:
  extends: [.go-base, .go-image]
  stage: lint
  script:
    - if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; gofmt -d .; exit 1; fi

lint:vet:
  extends: [.go-base, .go-image]
  stage: lint
  script:
    - go vet ./...

test:
  extends: [.go-test, .go-image]
  variables:
    CGO_ENABLED: "1"

build:
  extends: [.go-build, .go-image]
  script:
    - mkdir -p bin
    - go build -o bin/fi-mcp-gateway ./cmd/fi-mcp-gateway
  artifacts:
    paths:
      - bin/fi-mcp-gateway
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.21
  script:
    - echo "No deploy configured for fi-mcp-gateway (binary-only repo)."
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
