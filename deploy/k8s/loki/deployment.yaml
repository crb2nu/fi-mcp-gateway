apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: loki
    component: mcp-server
    mcp.server/name: loki
    mcp.server/type: custom
  name: loki
  namespace: mcp-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      annotations:
        mcp.server/categories: logging,observability
        mcp.server/description: Query and analyze Loki log aggregation
      labels:
        app: loki
        component: mcp-server
        mcp.server/name: loki
    spec:
      containers:
        - env:
            - name: CONTEXT_BROKER_PUBLISH
              value: "1"
            - name: CONTEXT_BROKER_HOST
              value: 127.0.0.1
            - name: CONTEXT_BROKER_PORT
              value: "9876"
            - name: LOKI_URL
              value: ${env:LOKI_URL:-http://loki.logging.svc.cluster.local:3100}
            - name: LOKI_PORT_FORWARD
              value: ${env:LOKI_PORT_FORWARD:-true}
            - name: LOG_LEVEL
              value: info
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: loki
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-loki
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: loki
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
