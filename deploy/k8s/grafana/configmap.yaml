apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - grafana_search
        - grafana_get_dashboard
    categories:
        - monitoring
        - dashboards
    description: Grafana dashboard search and retrieval
    name: grafana
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: grafana
    component: mcp-server
  name: grafana-config
  namespace: mcp-hub
