apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qdrant
    component: mcp-server
    mcp.server/name: qdrant
    mcp.server/type: custom
  name: qdrant
  namespace: mcp-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      annotations:
        mcp.server/categories: database,vector
        mcp.server/description: Qdrant vector database operations (Go native)
      labels:
        app: qdrant
        component: mcp-server
        mcp.server/name: qdrant
    spec:
      containers:
        - env:
            - name: QDRANT_URL
              value: ${env:QDRANT_URL:-http://192.168.50.176:6333}
            - name: QDRANT_API_KEY
              value: ${env:QDRANT_API_KEY}
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: qdrant
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-qdrant
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: qdrant
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
