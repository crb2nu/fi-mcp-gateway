apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - k8s.apply
        - k8s.get
        - k8s.getPods
        - k8s.logs
        - k8s.describe
        - k8s.exec
        - k8s.listNamespaces
        - k8s.listContexts
    categories:
        - kubernetes
        - operations
    description: Kubernetes operations for the k3s apps cluster (use for app deploys, logs, rollouts)
    name: k8s_apps_k3s
    timeout: 90
kind: ConfigMap
metadata:
  labels:
    app: k8s-apps-k3s
    component: mcp-server
  name: k8s-apps-k3s-config
  namespace: mcp-hub
