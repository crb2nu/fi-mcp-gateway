apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - create_or_update_file
        - push_files
        - search_repositories
        - create_repository
        - get_file_contents
        - create_issue
        - list_issues
        - create_merge_request
        - list_merge_requests
        - fork_repository
        - create_branch
        - get_project
        - list_projects
    categories:
        - devops
        - scm
    description: GitLab repository operations and management (Go native)
    name: gitlab
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: gitlab
    component: mcp-server
  name: gitlab-config
  namespace: mcp-hub
