apiVersion: v1
data:
  server.yaml: |
    always_allow:
        - cf_verify_token
        - cf_list_zones
        - cf_list_tunnels
    categories:
        - networking
        - operations
    description: Cloudflare API utilities (token verify, zones, tunnels)
    name: cloudflare
    timeout: 60
kind: ConfigMap
metadata:
  labels:
    app: cloudflare
    component: mcp-server
  name: cloudflare-config
  namespace: mcp-hub
