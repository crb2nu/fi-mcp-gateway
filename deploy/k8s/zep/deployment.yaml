apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zep
    component: mcp-server
    mcp.server/name: zep
    mcp.server/type: custom
  name: zep
  namespace: mcp-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zep
  template:
    metadata:
      annotations:
        mcp.server/categories: memory
        mcp.server/description: Zep Cloud memory (sessions/messages) via MCP (Go native)
      labels:
        app: zep
        component: mcp-server
        mcp.server/name: zep
    spec:
      containers:
        - env:
            - name: ZEP_API_URL
              value: ${env:ZEP_API_URL:-https://api.getzep.com}
            - name: ZEP_API_KEY
              value: ${keychain:ZEP_API_KEY}
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: zep
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-zep
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: zep
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
